<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-sm w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">카운터</h1>

        <div class="text-center mb-8">
            <p class="text-6xl font-bold text-blue-600" id="count">0</p>
        </div>

        <div class="flex gap-4 justify-center">
            <button
                onclick="decrease()"
                class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition duration-200">
                -1
            </button>
            <button
                onclick="increase()"
                class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition duration-200">
                +1
            </button>
            <button
                onclick="reset()"
                class="px-6 py-3 bg-blue-400 hover:bg-blue-500 text-white font-bold rounded-lg transition duration-200">
                리셋
            </button>
        </div>
    </div>

    <script>
        let count = 0;

        function updateDisplay() {
            document.getElementById('count').textContent = count;
        }

        function increase() {
            count++;
            updateDisplay();
        }

        function decrease() {
            count--;
            updateDisplay();
        }

        function reset() {
            count = 0;
            updateDisplay();
        }
    </script>
</body>
</html>
