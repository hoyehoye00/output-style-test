<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    :root {
      --bg-dark: #1c1c1c;
      --bg-light: #343434;
      --bg-number: #505050;
      --bg-operator: #ff9500;
      --text-primary: #ffffff;
      --border-radius: 12px;
      --transition: 0.1s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator {
      background: var(--bg-dark);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 350px;
    }

    .display {
      background: var(--bg-dark);
      border-radius: var(--border-radius);
      padding: 24px 16px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .previous-operand {
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      min-height: 24px;
      margin-bottom: 8px;
    }

    .current-operand {
      color: var(--text-primary);
      font-size: 32px;
      font-weight: 300;
      word-wrap: break-word;
      word-break: break-all;
      min-height: 40px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 70px;
      border: none;
      border-radius: var(--border-radius);
      font-size: 24px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-number, .btn-decimal {
      background: var(--bg-number);
    }

    .btn-number:active, .btn-decimal:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-operator, .btn-equals {
      background: var(--bg-operator);
      font-size: 28px;
    }

    .btn-operator:active, .btn-equals:active {
      background: #ff8c00;
    }

    .btn-clear {
      background: var(--bg-light);
      color: var(--text-primary);
      font-size: 20px;
    }

    .btn-clear:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-zero {
      grid-column: span 2;
    }

    @media (max-width: 480px) {
      .calculator {
        padding: 16px;
      }

      button {
        font-size: 20px;
      }

      .current-operand {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previousOperand"></div>
      <div class="current-operand" id="currentOperand">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clear()">C</button>
      <button class="btn-clear" onclick="toggleSign()">±</button>
      <button class="btn-clear" onclick="inputPercent()">%</button>
      <button class="btn-operator" onclick="setOperator('÷')">÷</button>

      <button class="btn-number" onclick="inputDigit('7')">7</button>
      <button class="btn-number" onclick="inputDigit('8')">8</button>
      <button class="btn-number" onclick="inputDigit('9')">9</button>
      <button class="btn-operator" onclick="setOperator('×')">×</button>

      <button class="btn-number" onclick="inputDigit('4')">4</button>
      <button class="btn-number" onclick="inputDigit('5')">5</button>
      <button class="btn-number" onclick="inputDigit('6')">6</button>
      <button class="btn-operator" onclick="setOperator('−')">−</button>

      <button class="btn-number" onclick="inputDigit('1')">1</button>
      <button class="btn-number" onclick="inputDigit('2')">2</button>
      <button class="btn-number" onclick="inputDigit('3')">3</button>
      <button class="btn-operator" onclick="setOperator('+')">+</button>

      <button class="btn-number btn-zero" onclick="inputDigit('0')">0</button>
      <button class="btn-decimal" onclick="inputDigit('.')">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentValue = '0';
    let previousValue = '';
    let operator = null;
    let shouldResetDisplay = false;

    function updateDisplay() {
      document.getElementById('currentOperand').textContent = currentValue;

      if (previousValue && operator) {
        const operatorMap = { '÷': ' ÷ ', '×': ' × ', '−': ' − ', '+': ' + ' };
        document.getElementById('previousOperand').textContent = previousValue + (operatorMap[operator] || '');
      } else {
        document.getElementById('previousOperand').textContent = '';
      }
    }

    function inputDigit(digit) {
      if (shouldResetDisplay) {
        currentValue = digit;
        shouldResetDisplay = false;
      } else {
        if (digit === '.' && currentValue.includes('.')) return;
        if (currentValue === '0' && digit !== '.') {
          currentValue = digit;
        } else {
          currentValue += digit;
        }
      }
      updateDisplay();
    }

    function setOperator(op) {
      if (operator !== null && !shouldResetDisplay) {
        calculate();
      }
      previousValue = currentValue;
      operator = op;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function calculate() {
      if (!operator || !previousValue) return;

      let result;
      const prev = parseFloat(previousValue);
      const current = parseFloat(currentValue);

      switch (operator) {
        case '+':
          result = prev + current;
          break;
        case '−':
          result = prev - current;
          break;
        case '×':
          result = prev * current;
          break;
        case '÷':
          result = current !== 0 ? prev / current : 0;
          break;
        default:
          return;
      }

      currentValue = result.toString();
      operator = null;
      previousValue = '';
      shouldResetDisplay = true;
      updateDisplay();
    }

    function clear() {
      currentValue = '0';
      previousValue = '';
      operator = null;
      shouldResetDisplay = false;
      updateDisplay();
    }

    function toggleSign() {
      currentValue = (parseFloat(currentValue) * -1).toString();
      updateDisplay();
    }

    function inputPercent() {
      currentValue = (parseFloat(currentValue) / 100).toString();
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
